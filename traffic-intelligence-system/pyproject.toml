[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-intel"
version = "1.0.0"
description = "Traffic Intersection Intelligence System for Indian smart-city traffic simulation and analytics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Traffic Intersection Intelligence System Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
traffic-intel = "traffic_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
